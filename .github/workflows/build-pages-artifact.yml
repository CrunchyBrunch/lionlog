name: Build reviewable GitHub Pages artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pages-artifact:
    if: github.repository == 'CrunchyBrunch/lionlog'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec tsc -- --noEmit
      - run: npm test
      - run: npm run lint
      - name: Build static project-site artifact
        env:
          LIONLOG_BASE_PATH: /lionlog
          LIONLOG_PUBLIC_ORIGIN: https://crunchybrunch.github.io
        run: npm run build
      - name: Verify static Pages boundary
        run: |
          test -f dist/client/index.html
          test -f dist/client/.nojekyll
          test ! -e public/menu-data
          test ! -e dist/client/menu-data
      - name: Prepare isolated Pages artifact
        run: >-
          node --experimental-strip-types scripts/prepare-pages-artifact.ts
          --source=dist/client
          --output=work/pages-artifact/site
      - name: Package and round-trip validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          tar --directory work/pages-artifact/site --dereference --hard-dereference -cf work/pages-artifact/artifact.tar .
          mkdir work/pages-artifact/round-trip
          tar -xf work/pages-artifact/artifact.tar -C work/pages-artifact/round-trip
          node --experimental-strip-types scripts/prepare-pages-artifact.ts --validate=work/pages-artifact/round-trip
          diff -qr work/pages-artifact/site work/pages-artifact/round-trip
          test "$(tar -tf work/pages-artifact/artifact.tar | grep -c '^./.nojekyll$')" -eq 1
      - name: Retain reviewable Pages artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: github-pages-review
          path: work/pages-artifact/artifact.tar
          retention-days: 7
          if-no-files-found: error
