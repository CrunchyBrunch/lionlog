name: Prepare live Pages field-release artifact

on:
  workflow_dispatch:
    inputs:
      service_date:
        description: PSU service date (strict YYYY-MM-DD)
        required: true
        type: string
      confirmation:
        description: Type PREPARE_LIVE_PAGES_FIELD_RELEASE to authorize public PSU requests
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-artifact:
    if: >-
      github.repository == 'CrunchyBrunch/lionlog' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/live-pages-field-release-alpha-4') &&
      inputs.confirmation == 'PREPARE_LIVE_PAGES_FIELD_RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec tsc -- --noEmit
      - run: npm test
      - run: npm run lint
      - name: Validate strict service-date input
        env:
          SERVICE_DATE: ${{ inputs.service_date }}
        run: >-
          node --experimental-strip-types -e
          "import { sourceDateFromIso } from './infrastructure/psu/constants.ts';
          sourceDateFromIso(process.env.SERVICE_DATE ?? '')"
      - name: Restore versioned validated nutrition cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/psu-field-release-cache/lionlog.psu-nutrition.v1
          key: lionlog-psu-nutrition-v1-psu-html-v1-${{ inputs.service_date }}
      - run: npm run validate:psu-release-cache
      - name: Run trusted source-driven field-release ingestion
        env:
          CI: "true"
          LIONLOG_ALLOW_PSU_NETWORK: "I_UNDERSTAND_THIS_CONTACTS_PSU"
          LIONLOG_RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          SERVICE_DATE: ${{ inputs.service_date }}
        run: >-
          npm run prepare:psu-field-release --
          --date="$SERVICE_DATE"
          --cache-dir=work/psu-field-release-cache
          --report=work/psu-field-release/report.json
      - run: npm run validate:psu-release-cache
      - name: Export the exact validated release set
        run: >-
          npm run export:psu-static --
          --cache-dir=work/psu-field-release-cache
          --output-dir=public
          --release-report=work/psu-field-release/report.json
      - name: Build project-site PWA with normalized menu data
        env:
          LIONLOG_BASE_PATH: /lionlog
          LIONLOG_PUBLIC_ORIGIN: https://crunchybrunch.github.io
        run: npm run build
      - name: Prepare isolated static artifact
        run: >-
          node --experimental-strip-types scripts/prepare-pages-artifact.ts
          --source=dist/client
          --output=work/pages-field-release/site
      - name: Round-trip validate exact artifact
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/prepare-pages-artifact.ts --validate=work/pages-field-release/site --require-menu-data
          tar --directory work/pages-field-release/site --dereference --hard-dereference -cf work/pages-field-release/site.tar .
          mkdir work/pages-field-release/round-trip
          tar -xf work/pages-field-release/site.tar -C work/pages-field-release/round-trip
          node --experimental-strip-types scripts/prepare-pages-artifact.ts --validate=work/pages-field-release/round-trip --require-menu-data
          diff -qr work/pages-field-release/site work/pages-field-release/round-trip
          find work/pages-field-release/site -type f -print0 | sort -z | xargs -0 sha256sum > work/pages-field-release/inventory.sha256
          cat work/pages-field-release/inventory.sha256
      - name: Retain reviewable static site (does not deploy)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lionlog-alpha-4-field-release-${{ inputs.service_date }}
          path: work/pages-field-release/site/
          if-no-files-found: error
          retention-days: 14
