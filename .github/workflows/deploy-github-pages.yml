name: Promote exact LionLog release to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Promote a fresh candidate or roll back to retained known-good bytes
        required: true
        type: choice
        options: [promote, rollback]
      candidate_run_id:
        description: Exact successful candidate run ID
        required: true
        type: string
      candidate_artifact_id:
        description: Exact retained candidate artifact ID
        required: true
        type: string
      candidate_artifact_digest:
        description: Exact sha256-prefixed candidate artifact digest
        required: true
        type: string
      candidate_manifest_sha256:
        description: Exact lowercase SHA-256 of release-manifest.json
        required: true
        type: string
      expected_release_id:
        description: Exact release ID from the candidate manifest
        required: true
        type: string
      expected_source_sha:
        description: Exact trusted-main commit that produced the candidate
        required: true
        type: string
      expected_service_date:
        description: Exact YYYY-MM-DD service date
        required: true
        type: string
      expected_workflow_sha:
        description: Exact main SHA containing this reviewed workflow
        required: true
        type: string
      expected_predecessor_release_id:
        description: Exact public predecessor release ID, or NONE_FIRST_PUBLICATION
        required: true
        type: string
      approval_expires_at:
        description: Exact PM approval expiry in canonical UTC milliseconds
        required: true
        type: string
      rollback_receipt_artifact_id:
        description: Exact known-good flat receipt artifact ID, or NONE for promotion
        required: true
        type: string
      rollback_receipt_artifact_digest:
        description: Exact known-good flat receipt artifact digest, or NONE for promotion
        required: true
        type: string
      confirmation:
        description: Type PROMOTE_EXACT_LIONLOG_RELEASE
        required: true
        type: string

permissions: {}

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  validate-and-stage:
    if: >-
      github.repository == 'CrunchyBrunch/lionlog' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.expected_workflow_sha == github.sha &&
      inputs.confirmation == 'PROMOTE_EXACT_LIONLOG_RELEASE'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      staged_artifact_id: ${{ steps.stage.outputs.artifact_id }}
      staged_artifact_name: ${{ steps.names.outputs.staged }}
      staged_artifact_digest: ${{ steps.staged.outputs.digest }}
      staged_artifact_expires_at: ${{ steps.staged.outputs.expires_at }}
      summary_artifact_id: ${{ steps.summary-upload.outputs.artifact-id }}
      summary_artifact_digest: ${{ steps.summary-digest.outputs.digest }}
      summary_artifact_name: ${{ steps.names.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      - name: Validate immutable input shapes
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          EXPECTED_RELEASE_ID: ${{ inputs.expected_release_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SERVICE_DATE: ${{ inputs.expected_service_date }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          EXPECTED_PREDECESSOR: ${{ inputs.expected_predecessor_release_id }}
          APPROVAL_EXPIRES_AT: ${{ inputs.approval_expires_at }}
          ROLLBACK_RECEIPT_ID: ${{ inputs.rollback_receipt_artifact_id }}
          ROLLBACK_RECEIPT_DIGEST: ${{ inputs.rollback_receipt_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ARTIFACT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$CANDIDATE_MANIFEST_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_RELEASE_ID" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$EXPECTED_SERVICE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$EXPECTED_PREDECESSOR" == "NONE_FIRST_PUBLICATION" || "$EXPECTED_PREDECESSOR" =~ ^[a-f0-9]{64}$ ]]
          [[ "$APPROVAL_EXPIRES_AT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$ ]]
          if [[ "$OPERATION" == "promote" ]]; then
            test "$ROLLBACK_RECEIPT_ID" = NONE
            test "$ROLLBACK_RECEIPT_DIGEST" = NONE
          else
            [[ "$ROLLBACK_RECEIPT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$ROLLBACK_RECEIPT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          fi
      - id: names
        shell: bash
        run: |
          echo "staged=lionlog-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
          echo "summary=lionlog-pages-preapproval-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Read exact GitHub provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          mkdir -p work/supported-pages/metadata
          gh api "repos/${{ github.repository }}" > work/supported-pages/metadata/repository.json
          gh api "repos/${{ github.repository }}/commits/main" > work/supported-pages/metadata/main.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > work/supported-pages/metadata/workflow-run.json
          gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID" > work/supported-pages/metadata/candidate-run.json
          gh api "repos/${{ github.repository }}/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > work/supported-pages/metadata/candidate-artifact.json
          gh api "repos/${{ github.repository }}/actions/workflows/346680782/runs?head_sha=$EXPECTED_SOURCE_SHA&branch=main&event=push&status=success&per_page=10" \
            --jq '[.workflow_runs[] | select(.head_sha == env.EXPECTED_SOURCE_SHA and .run_attempt == 1 and .path == ".github/workflows/ci.yml")] | first' \
            > work/supported-pages/metadata/ci-run.json
          CI_RUN_ID="$(jq -er .id work/supported-pages/metadata/ci-run.json)"
          gh api "repos/${{ github.repository }}/actions/runs/$CI_RUN_ID/jobs?per_page=100" --jq .jobs > work/supported-pages/metadata/ci-jobs.json
          jq -n --slurpfile repository work/supported-pages/metadata/repository.json --slurpfile main work/supported-pages/metadata/main.json \
            --slurpfile workflowRun work/supported-pages/metadata/workflow-run.json --slurpfile candidateRun work/supported-pages/metadata/candidate-run.json \
            --slurpfile candidateArtifact work/supported-pages/metadata/candidate-artifact.json --slurpfile ciRun work/supported-pages/metadata/ci-run.json \
            --slurpfile ciJobs work/supported-pages/metadata/ci-jobs.json \
            '{repository:$repository[0],main:$main[0],workflowRun:$workflowRun[0],candidateRun:$candidateRun[0],candidateArtifact:$candidateArtifact[0],ciRun:$ciRun[0],ciJobs:$ciJobs[0]}' \
            > work/supported-pages/metadata.json
      - name: Bind the exact public predecessor before approval
        run: >-
          node --experimental-strip-types scripts/public-release-state.ts
          --expected=${{ inputs.expected_predecessor_release_id }}
          --output=work/supported-pages/public-predecessor.json
      - name: Download exact retained inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          ROLLBACK_RECEIPT_ID: ${{ inputs.rollback_receipt_artifact_id }}
          ROLLBACK_RECEIPT_DIGEST: ${{ inputs.rollback_receipt_artifact_digest }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > work/supported-pages/candidate.zip
          test "sha256:$(sha256sum work/supported-pages/candidate.zip | cut -d' ' -f1)" = "$CANDIDATE_ARTIFACT_DIGEST"
          node --experimental-strip-types scripts/artifact-zip.ts --zip=work/supported-pages/candidate.zip --output=work/supported-pages/candidate --expected=release-manifest.json,site.tar
          if [[ "$OPERATION" == rollback ]]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ROLLBACK_RECEIPT_ID" > work/supported-pages/rollback-receipt-artifact.json
            RECEIPT_RUN_ID="$(jq -er .workflow_run.id work/supported-pages/rollback-receipt-artifact.json)"
            gh api "repos/${{ github.repository }}/actions/runs/$RECEIPT_RUN_ID" > work/supported-pages/rollback-receipt-run.json
            gh api "repos/${{ github.repository }}/actions/artifacts/$ROLLBACK_RECEIPT_ID/zip" > work/supported-pages/rollback-receipt.zip
            test "sha256:$(sha256sum work/supported-pages/rollback-receipt.zip | cut -d' ' -f1)" = "$ROLLBACK_RECEIPT_DIGEST"
            node --experimental-strip-types scripts/artifact-zip.ts --zip=work/supported-pages/rollback-receipt.zip --output=work/supported-pages/rollback-receipt --expected=pages-receipt.json
          fi
      - name: Validate candidate and extract exact site bytes
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [[ "$OPERATION" == rollback ]]; then
            EXTRA_ARGS+=("--rollback-receipt=work/supported-pages/rollback-receipt/pages-receipt.json")
            EXTRA_ARGS+=("--rollback-receipt-artifact-id=${{ inputs.rollback_receipt_artifact_id }}")
            EXTRA_ARGS+=("--rollback-receipt-artifact-digest=${{ inputs.rollback_receipt_artifact_digest }}")
            EXTRA_ARGS+=("--rollback-receipt-artifact-metadata=work/supported-pages/rollback-receipt-artifact.json")
            EXTRA_ARGS+=("--rollback-receipt-run-metadata=work/supported-pages/rollback-receipt-run.json")
          fi
          node --experimental-strip-types scripts/supported-pages-release.ts candidate \
            --operation="$OPERATION" --bundle=work/supported-pages/candidate --extract=work/supported-pages/site \
            --metadata=work/supported-pages/metadata.json --workflow-sha=${{ inputs.expected_workflow_sha }} --workflow-run-id=${{ github.run_id }} \
            --candidate-run-id=${{ inputs.candidate_run_id }} --candidate-artifact-id=${{ inputs.candidate_artifact_id }} \
            --candidate-artifact-digest=${{ inputs.candidate_artifact_digest }} --candidate-manifest-sha256=${{ inputs.candidate_manifest_sha256 }} \
            --release-id=${{ inputs.expected_release_id }} --source-sha=${{ inputs.expected_source_sha }} --service-date=${{ inputs.expected_service_date }} \
            --approval-expires-at=${{ inputs.approval_expires_at }} --predecessor-release-id=${{ inputs.expected_predecessor_release_id }} \
            --public-predecessor=work/supported-pages/public-predecessor.json \
            "${EXTRA_ARGS[@]}" > work/supported-pages/validated.json
      - id: stage
        name: Stage exact bytes with official Pages artifact action
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.names.outputs.staged }}
          path: work/supported-pages/site
          retention-days: 90
          include-hidden-files: true
      - id: staged
        name: Re-download and verify staged bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_ID: ${{ steps.stage.outputs.artifact_id }}
          STAGED_NAME: ${{ steps.names.outputs.staged }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh api "repos/${{ github.repository }}/actions/artifacts/$STAGED_ID" > work/supported-pages/staged-metadata.json; then break; fi
            sleep 2
          done
          test "$(jq -er .name work/supported-pages/staged-metadata.json)" = "$STAGED_NAME"
          test "$(jq -er .workflow_run.id work/supported-pages/staged-metadata.json)" = "${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/actions/artifacts/$STAGED_ID/zip" > work/supported-pages/staged.zip
          STAGED_DIGEST="sha256:$(sha256sum work/supported-pages/staged.zip | cut -d' ' -f1)"
          test "$STAGED_DIGEST" = "$(jq -er .digest work/supported-pages/staged-metadata.json)"
          node --experimental-strip-types scripts/artifact-zip.ts --zip=work/supported-pages/staged.zip --output=work/supported-pages/staged-wrapper --expected=artifact.tar
          node --experimental-strip-types scripts/supported-pages-release.ts stage --validated=work/supported-pages/validated.json \
            --staged-metadata=work/supported-pages/staged-metadata.json --staged-name="$STAGED_NAME" \
            --staged-tar=work/supported-pages/staged-wrapper/artifact.tar > work/supported-pages/preapproval.json
          echo "digest=$STAGED_DIGEST" >> "$GITHUB_OUTPUT"
          echo "expires_at=$(jq -er .expires_at work/supported-pages/staged-metadata.json)" >> "$GITHUB_OUTPUT"
      - id: summary-upload
        name: Retain compact preapproval evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ${{ steps.names.outputs.summary }}
          path: work/supported-pages/preapproval.json
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - id: summary-digest
        name: Normalize retained preapproval wrapper digest
        shell: bash
        env:
          RAW_DIGEST: ${{ steps.summary-upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          NORMALIZED="$(node --experimental-strip-types scripts/artifact-digest.ts --expected="$RAW_DIGEST" --actual="$RAW_DIGEST")"
          echo "digest=$NORMALIZED" >> "$GITHUB_OUTPUT"
      - name: Publish human review summary
        shell: bash
        run: |
          {
            echo '## Protected Pages approval'
            echo
            echo '- Operation: `${{ inputs.operation }}`'
            echo '- Release: `${{ inputs.expected_release_id }}`'
            echo '- Candidate artifact: `${{ inputs.candidate_artifact_id }}` / `${{ inputs.candidate_artifact_digest }}`'
            echo '- Staged artifact: `${{ steps.stage.outputs.artifact_id }}` / `${{ steps.staged.outputs.digest }}`'
            echo "- Coverage: \`$(jq -r .release.coverage work/supported-pages/preapproval.json)\`; invalid-name omissions: \`$(jq -r '.release.omissions[\"invalid-name\"]' work/supported-pages/preapproval.json)\`"
            echo "- Fresh until: \`$(jq -r .release.earliestFreshUntil work/supported-pages/preapproval.json)\`"
            echo "- Retained until: \`$(jq -r .release.earliestRetainUntil work/supported-pages/preapproval.json)\`"
            echo "- Public predecessor: \`${{ inputs.expected_predecessor_release_id }}\`"
            echo "- Approval expires: \`${{ inputs.approval_expires_at }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: validate-and-stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      submission_started: ${{ steps.submission.outputs.started }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      - name: Download exact preapproval summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_ID: ${{ needs.validate-and-stage.outputs.summary_artifact_id }}
          SUMMARY_DIGEST: ${{ needs.validate-and-stage.outputs.summary_artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p work/supported-pages-final
          gh api "repos/${{ github.repository }}/actions/artifacts/$SUMMARY_ID/zip" > work/supported-pages-final/summary.zip
          node --experimental-strip-types scripts/artifact-digest.ts --expected="$SUMMARY_DIGEST" --file=work/supported-pages-final/summary.zip > /dev/null
          node --experimental-strip-types scripts/artifact-zip.ts --zip=work/supported-pages-final/summary.zip \
            --output=work/supported-pages-final/summary --expected=preapproval.json
      - name: Recheck all authority immediately before submission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          SUMMARY=work/supported-pages-final/summary/preapproval.json
          CI_RUN_ID="$(jq -er .ci.runId "$SUMMARY")"
          gh api "repos/${{ github.repository }}" > work/supported-pages-final/repository.json
          gh api "repos/${{ github.repository }}/commits/main" > work/supported-pages-final/main.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" > work/supported-pages-final/workflow-run.json
          gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID" > work/supported-pages-final/candidate-run.json
          gh api "repos/${{ github.repository }}/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > work/supported-pages-final/candidate-artifact.json
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq .artifacts > work/supported-pages-final/staged-artifacts.json
          gh api "repos/${{ github.repository }}/actions/runs/$CI_RUN_ID" > work/supported-pages-final/ci-run.json
          node --experimental-strip-types scripts/public-release-state.ts \
            --expected="$(jq -er .authorization.predecessorReleaseId "$SUMMARY")" \
            --output=work/supported-pages-final/public-predecessor.json
          if [[ "$(jq -r .operation "$SUMMARY")" == rollback ]]; then
            RECEIPT_ARTIFACT_ID="$(jq -er .rollbackReceipt.artifactId "$SUMMARY")"
            RECEIPT_RUN_ID="$(jq -er .rollbackReceipt.runId "$SUMMARY")"
            gh api "repos/${{ github.repository }}/actions/artifacts/$RECEIPT_ARTIFACT_ID" > work/supported-pages-final/rollback-receipt-artifact.json
            gh api "repos/${{ github.repository }}/actions/runs/$RECEIPT_RUN_ID" > work/supported-pages-final/rollback-receipt-run.json
          else
            echo null > work/supported-pages-final/rollback-receipt-artifact.json
            echo null > work/supported-pages-final/rollback-receipt-run.json
          fi
          node --experimental-strip-types scripts/collect-pages-attempt-history.ts \
            --output=work/supported-pages-final/prior-attempts.json \
            --incidents=infrastructure/publication/pages-incident-history.json
          jq -n --slurpfile repository work/supported-pages-final/repository.json --slurpfile main work/supported-pages-final/main.json \
            --slurpfile workflowRun work/supported-pages-final/workflow-run.json --slurpfile candidateRun work/supported-pages-final/candidate-run.json \
            --slurpfile candidateArtifact work/supported-pages-final/candidate-artifact.json --slurpfile stagedArtifacts work/supported-pages-final/staged-artifacts.json \
            --slurpfile ciRun work/supported-pages-final/ci-run.json --slurpfile priorAttempts work/supported-pages-final/prior-attempts.json \
            --slurpfile rollbackReceiptArtifact work/supported-pages-final/rollback-receipt-artifact.json \
            --slurpfile rollbackReceiptRun work/supported-pages-final/rollback-receipt-run.json \
            --slurpfile publicPredecessor work/supported-pages-final/public-predecessor.json \
            '{repository:$repository[0],main:$main[0],workflowRun:$workflowRun[0],candidateRun:$candidateRun[0],candidateArtifact:$candidateArtifact[0],stagedArtifacts:$stagedArtifacts[0],ciRun:$ciRun[0],priorAttempts:$priorAttempts[0],rollbackReceiptArtifact:$rollbackReceiptArtifact[0],rollbackReceiptRun:$rollbackReceiptRun[0],publicPredecessor:$publicPredecessor[0]}' \
            > work/supported-pages-final/state.json
          node --experimental-strip-types scripts/supported-pages-control.ts verify --summary="$SUMMARY" \
            --state=work/supported-pages-final/state.json --incidents=infrastructure/publication/pages-incident-history.json \
            > work/supported-pages-final/verified.json
      - id: submission
        name: Record official submission boundary
        shell: bash
        run: echo "started=true" >> "$GITHUB_OUTPUT"
      - id: deployment
        name: Deploy with official Pages action
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.validate-and-stage.outputs.staged_artifact_name }}
          timeout: 600000

  verify-public:
    if: ${{ always() && needs.validate-and-stage.result == 'success' && needs.deploy.result != 'skipped' }}
    needs: [validate-and-stage, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --omit=dev
      - name: Recover exact summary and manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_ID: ${{ needs.validate-and-stage.outputs.summary_artifact_id }}
          SUMMARY_DIGEST: ${{ needs.validate-and-stage.outputs.summary_artifact_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p work/supported-pages-public
          gh api "repos/${{ github.repository }}/actions/artifacts/$SUMMARY_ID/zip" > work/supported-pages-public/summary.zip
          node --experimental-strip-types scripts/artifact-digest.ts --expected="$SUMMARY_DIGEST" --file=work/supported-pages-public/summary.zip > /dev/null
          node --experimental-strip-types scripts/artifact-zip.ts --zip=work/supported-pages-public/summary.zip --output=work/supported-pages-public/summary --expected=preapproval.json
          gh api "repos/${{ github.repository }}/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > work/supported-pages-public/candidate.zip
          test "sha256:$(sha256sum work/supported-pages-public/candidate.zip | cut -d' ' -f1)" = "$CANDIDATE_ARTIFACT_DIGEST"
          node --experimental-strip-types scripts/artifact-zip.ts --zip=work/supported-pages-public/candidate.zip --output=work/supported-pages-public/candidate --expected=release-manifest.json,site.tar
          node --experimental-strip-types scripts/select-browser-verification-context.ts \
            --bundle=work/supported-pages-public/candidate \
            --output=work/supported-pages-public/browser-context.json
          printf '%s\n' '{"markerVerified":false,"inventoryVerified":false,"browserVerified":false}' > work/supported-pages-public/checks.json
      - name: Verify public inventory and mobile PWA behavior
        if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.submission_started == 'true' }}
        shell: bash
        env:
          RELEASE_MANIFEST_PATH: work/supported-pages-public/candidate/release-manifest.json
          PUBLIC_URL: https://crunchybrunch.github.io/lionlog/
          BROWSER_CONTEXT_PATH: work/supported-pages-public/browser-context.json
        run: |
          set -euo pipefail
          RELEASE_ID="$(jq -er .releaseId "$RELEASE_MANIFEST_PATH")"
          VERIFIED=false
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-public-site.mjs; then VERIFIED=true; break; fi
            sleep 5
          done
          test "$VERIFIED" = true
          curl --fail --silent --show-error --location --max-time 15 -H 'Cache-Control: no-cache' "${PUBLIC_URL}release.json" > work/supported-pages-public/public-release.json
          test "$(jq -er .releaseId work/supported-pages-public/public-release.json)" = "$RELEASE_ID"
          jq '.markerVerified=true | .inventoryVerified=true' work/supported-pages-public/checks.json > work/supported-pages-public/checks.next.json
          mv work/supported-pages-public/checks.next.json work/supported-pages-public/checks.json
          node scripts/verify-public-pwa.mjs
          jq '.browserVerified=true' work/supported-pages-public/checks.json > work/supported-pages-public/checks.next.json
          mv work/supported-pages-public/checks.next.json work/supported-pages-public/checks.json
      - name: Create one flat retained receipt
        if: always()
        shell: bash
        env:
          SUBMISSION_STARTED: ${{ needs.deploy.outputs.submission_started }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          jq -n --argjson submissionStarted "${SUBMISSION_STARTED:-false}" --arg result "$DEPLOY_RESULT" --arg pageUrl "${PAGE_URL:-}" \
            --slurpfile public work/supported-pages-public/checks.json \
            '{official:{submissionStarted:$submissionStarted,result:$result,pageUrl:(if $pageUrl == "" then null else $pageUrl end),deploymentId:null},public:$public[0]}' \
            > work/supported-pages-public/result.json
          node --experimental-strip-types scripts/supported-pages-control.ts receipt \
            --summary=work/supported-pages-public/summary/preapproval.json --result=work/supported-pages-public/result.json \
            > work/supported-pages-public/pages-receipt.json
      - name: Retain flat receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: lionlog-pages-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/supported-pages-public/pages-receipt.json
          retention-days: 90
          if-no-files-found: error
          overwrite: false
      - name: Require fully verified known-good result
        if: always()
        shell: bash
        run: |
          test "$(jq -r .knownGood work/supported-pages-public/pages-receipt.json)" = true
          test "$(jq -r .unresolved work/supported-pages-public/pages-receipt.json)" = false
